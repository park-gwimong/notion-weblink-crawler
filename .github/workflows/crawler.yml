name: Tech Blog Crawler

on:
  schedule:
    # 매일 오전 8시 17분 (한국 시간 = UTC 전날 23:17)
    # 정각(:00)은 GitHub 예약 실행이 몰려 수 시간씩 밀리므로 분을 비켜 둔다
    - cron: '17 23 * * *'
  workflow_dispatch:  # 수동 실행 가능

permissions:
  contents: write

jobs:
  crawl-and-update:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        playwright install --with-deps chromium

    - name: Run crawler
      env:
        NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
      run: |
        python main.py

    - name: Commit cache file
      # 크롤러가 실패 코드로 끝나도, 그 전에 추가된 글의 캐시는 저장해야 중복 추가를 막을 수 있다
      if: always()
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add notion_urls_cache.txt
        git diff --quiet && git diff --staged --quiet || git commit -m "Update notion cache [skip ci]"
        git push
